name: Build site

# Rebuilds articles, the homepage ("Latest Guides" + full index), category pages
# and sitemap.xml whenever article sources or the builder change.
on:
  push:
    branches: [main]
    paths:
      - "_src/**"
      - "_build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 _build/build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add -A articles guides index.html sitemap.xml about.html contact.html privacy.html terms.html quote.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild site from _src"
            git push
          fi
